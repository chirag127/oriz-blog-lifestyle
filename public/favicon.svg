<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Slow Hours</title>
  <rect width="32" height="32" rx="8" fill="#f7f6f2"/>
  <!-- the day's ribbon: a row of hour ticks, the current hour lit in clay -->
  <g fill="#c9c6bb">
    <rect x="5" y="19" width="2" height="4" rx="1"/>
    <rect x="9" y="17" width="2" height="6" rx="1"/>
    <rect x="13" y="15" width="2" height="8" rx="1"/>
    <rect x="21" y="15" width="2" height="8" rx="1"/>
    <rect x="25" y="17" width="2" height="6" rx="1"/>
  </g>
  <!-- lit hour -->
  <rect x="17" y="9" width="2" height="14" rx="1" fill="#b4552f"/>
  <circle cx="18" cy="9" r="3" fill="#b4552f"/>
</svg>
